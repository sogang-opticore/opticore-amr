amcl:
  ros__parameters:
    use_sim_time: true

    # 프레임 — 프로젝트 기준
    global_frame_id: map
    odom_frame_id: odom_filtered   # EKF 출력 프레임과 일치
    base_frame_id: base_footprint

    # 스캔 토픽 — URDF/bridge와 일치
    scan_topic: /lidar

    # 파티클 수 (창고 40x30m 기준 적절한 범위)
    min_particles: 500
    max_particles: 3000

    # 라이다 모델 — 프로젝트 LiDAR 스펙 반영
    laser_model_type: likelihood_field
    laser_max_range: 12.0       # URDF max_laser_range와 동일
    laser_min_range: 0.12       # URDF min과 동일
    max_beams: 60

    # 모션 모델 (diff-drive)
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    # 초기 위치 — 스폰 위치(world 3.0, 15.0) 를 map frame 으로 변환
    #
    # 2026-05-25 (SW · 페어, DWA spiral 진단 2 차) 정정:
    #   warehouse_map.yaml origin: [-3.09, -15.3, 0]
    #     → map frame 원점이 world 좌표 (-3.09, -15.3) 에 위치.
    #   map frame 좌표 = world 좌표 − origin
    #     x = 3.0  − (−3.09) = 6.09
    #     y = 15.0 − (−15.3) = 30.3
    #   이전 값 (0, 0) 은 origin 부호를 빠뜨린 계산 오류였음 (3.0 − 3.09 로 잘못 계산).
    #   AMCL 이 30 m 어긋난 곳에서 시작 → scan matching 큰 보정 → TF JUMP / lag 의 근본 원인.
    set_initial_pose: true
    initial_pose:
      x: 6.09   # world spawn (3.0)  − map origin (-3.09)
      y: 30.3   # world spawn (15.0) − map origin (-15.3)
      yaw: 0.0

    # 맵 업데이트 — 2026-05-25 (SW · 페어, DWA spiral 진단 결과) 수정
    #
    # 진단 데이터: TF stamp age 가 이동 중 1248~3824ms 로 측정.
    # 적용된 원인 2종:
    #   1) transform_tolerance: 1.0 → 옛 TF 가 1초간 valid 표시되어
    #      DWA tf_buffer.lookup_transform(Time(0)) 이 1초 묵은 transform 을 반환.
    #   2) update_min_d/a: 0.1 → 로봇이 10cm/0.1rad 움직이기 전엔 pose
    #      재추정 안 함 → 그 사이 robot 은 이동했는데 transform 은 옛 위치.
    #
    # 2026-05-25 정정: 이전에 transform_publish_period: 0.05 를 추가했었으나,
    # ros2 param get 으로 "Parameter not set" 확인 — nav2_amcl (ROS2) 에는 해당
    # 파라미터가 없음 (ROS1 amcl 유산). 무시되므로 라인 제거. nav2_amcl 의 TF
    # publish 는 update_min_d/a 트리거 + transform_tolerance 기반 extrapolation
    # 으로 동작.
    #
    # 비유: GPS 가 10cm 단위로만 갱신되고 위성 신호가 1초까지 유효 표시되면
    #       자율주행 차는 "1초 묵은 10cm 단위" 위치로 계산 → 매번 어긋남.
    update_min_d: 0.05            # 5cm 마다 pose 재추정 (기존 0.1 → 더 자주)
    update_min_a: 0.05            # 0.05rad ≈ 2.9° 마다 (기존 0.1 → 더 자주)
    resample_interval: 1
    transform_tolerance: 0.1      # 100ms 만 valid (기존 1.0s → 1/10)
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1