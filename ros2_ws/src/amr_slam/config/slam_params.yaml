slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    mode: mapping

    # 프레임 — 반드시 프로젝트 URDF와 일치시킬 것
    odom_frame: odom  # SL-2 이후 EKF 붙이면 odom_filtered 로 변경
    map_frame: map
    base_frame: base_footprint
    scan_topic: /lidar

    use_sim_time: true

    # 해상도 — 40x30m 월드 기준 0.05m가 적절 (800x600px 맵)
    resolution: 0.05

    # 스캔 매칭
    use_scan_matching: true
    max_laser_range: 25.0
    minimum_laser_range: 0.12
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3

    # 스캔 버퍼
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 25.0

    # TF 퍼블리시 주기
    transform_publish_period: 0.02

    # 루프 클로저 — 창고 순환 시 필수
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0

    map_update_interval: 0.2          # 맵 업데이트 주기 (초) — 기본값 5.0
    publish_period_sec: 0.2           # /map 토픽 publish 주기 (초) — 기본값 1.0 ~ 5.0