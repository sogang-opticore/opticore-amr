# DWA Local Planner 파라미터 (2026-05-25 재설계 반영)
#
# CLAUDE.md 6.1: 모든 튜닝 값은 YAML로. 코드 안 하드코딩 금지.
# 변경 시 README.md §4 표와 동기화.
#
# 재설계 핵심 (2026-05-25 SW):
#   DWA 의 cycle 안 TF lookup 0번. EKF /odometry/filtered pose+twist 를 직접 사용.
#   global_path 받을 때 한 번만 map → odom_filtered 변환·캐싱.
#   → AMCL TF freeze / 보정 점프 의 영향 cycle 단위로 차단.
#   → 이전 spiral bug 의 근본 원인 제거.

dwa_planner:
  ros__parameters:
    use_sim_time: true

    # ----- 로봇 동역학 한계 (Notion 명세 §4.1) -----
    # TODO(디스코드 N-2): v_max 1.5 임시값. 명세 = 2.0. 팀 합의 후 갱신.
    v_max: 1.5          # m/s, ⚠ 임시값 (명세 §4.1: 2.0)
    v_min: -1.0         # m/s, 후진 운영 정책
    w_max: 1.5          # rad/s, 명세 §4.1
    a_max: 1.0          # m/s², 명세 §4.1
    alpha_max: 1.5      # rad/s², ⚠ 명세 미명시 — 시뮬 측정 후 갱신

    # ----- 샘플링 / 시뮬레이션 -----
    sample_v_n: 11
    sample_w_n: 21
    # predict_horizon × v_max ≈ lookahead_dist 여야 heading_score 가 의미 있음.
    # 1.0 → 0.3 (2026-05-25, CLAUDE.md §0.1 원칙 8 발동 후 발견):
    #   1.0s × 1.5m/s = 1.5m trajectory 가 lookahead 0.5m 를 항상 지나친 상태로 끝남.
    #   끝점에서 lookahead 방향 = 180° → heading_score=0. 모든 직진 trajectory 가 0점
    #   → 정지(v=0) trajectory 가 score 1등 → stuck.
    #   0.3s 면 trajectory 끝점 = 0.45m (lookahead 0.5m 직전) → 정상.
    # 비유: 300m 앞 우회전 안내인데 시뮬은 1km 앞까지 봐서 "우회전 지점이 뒤에 있네?
    #       돌아가야겠다" 라고 잘못 판단해 멈춰버림.
    predict_horizon: 0.3
    dt: 0.1                 # s, 적분 step. 0.3/0.1 = 3 step.
    control_rate: 20.0      # Hz

    # ----- 평가함수 가중치 (2026-05-25 회전 반경 줄이기 위해 재조정) -----
    # weight_path_tangent 큰 비중: 회전 trajectory 가 path 진행 방향과 안 맞으면
    # 즉시 큰 페널티 → 직진 + 미세회전 trajectory 만 선호.
    # weight_heading 작게: 위치 정렬은 path_tangent 와 align mode 가 보장.
    weight_heading: 0.3        # ↓ 위치 정렬 (heading_score_dist)
    weight_path_tangent: 2.0   # ↑↑ 자세 정렬 (path_tangent_score) — 결정적
    weight_clearance: 1.2
    weight_velocity: 0.3       # ↑ 직진 우대

    path_tangent_lookahead: 10

    # ----- 추종 / 평가 보조 -----
    # lookahead_dist: 가까울수록 부드러운 추종 (작은 yaw 차이), 멀수록 미리 회전.
    # 2026-05-25 (8차 진단) 1.0 → 0.5:
    #   1.0m 면 path 곡선의 1m 앞 점이 자기 yaw 와 ±90° 차이까지 가능 → align mode
    #   자주 진입 + 큰 회전. 0.5m 면 가까운 점 추종 → 작은 회전 + normal DWA 안에서
    #   회전+전진 자연스럽게 처리.
    lookahead_dist: 0.5
    max_clearance: 1.0      # m, clearance_score 정규화 분모
    goal_tolerance: 0.20    # m, 도착 판정

    # ----- In-place rotation 모드 (PD + hysteresis + v blending, 12차) -----
    # 표준 Pure Pursuit 의 forward velocity ramp + heading deadband:
    #
    # 1) Hysteresis: 진입 thresh (45°) > 종료 exit (15°). 진동 방지.
    #    mode 진입 후 angle 이 exit 이하 되어야 종료. 중간 영역에선 mode 유지.
    #
    # 2) PD 제어: w_cmd = P × angle - D × w_current
    #    D 항이 회전 관성 잡음. overshoot 없음.
    #
    # 3) v blending: angle 이 thresh → exit 로 줄어들면 v 도 0 → v_blend_max 로 증가.
    #    매끄러운 정지→전진 전환. align mode 종료 후 normal DWA 가 가속 인계.
    #
    # 비유: 자전거에서 큰 회전은 멈추고 핸들 돌리지만, 거의 정렬됐으면 페달 밟으면서
    #       미세조정. 굳이 완전히 멈출 필요 없음.
    align_angle_thresh: 0.785  # rad ≈ 45° (진입)
    align_angle_exit: 0.262    # rad ≈ 15° (종료, hysteresis)
    align_kp: 1.5              # PD 의 P gain
    align_kd: 0.5              # PD 의 D gain (관성 잡기)
    align_v_blend_max: 0.3     # m/s, blending v 상한 (사용자: 너무 컸음 0.5→0.3)
    # 13차 추가 (사용자 요구 "정렬되면 둘 다 멈추기"):
    # align mode 종료 후 이 시간 동안 재진입 금지 → normal DWA 가 직진 안정화.
    # 또한 PD 출력 부호가 angle 반대 = overshoot 시작 = 즉시 v=0,w=0 stop.
    align_cooldown: 1.0        # s, align mode 재진입 금지 시간

    # ----- 후진 / Path offset 안전장치 (2026-05-25 추가, CLAUDE.md §0.1 원칙 8) -----
    # 먼 거리 (20m+) 시나리오에서 발견된 두 문제 해결:
    #   (a) heading_score 가 후진 trajectory 도 만점 평가 → 모든 전진이 충돌일 때
    #       후진이 1등 선택. allow_backward=false 로 후진 sample 자체 차단.
    #       EMERGENCY 가 정직하게 표시되어 A* 재계획 유도.
    #   (b) path 옆길로 한 번 빠지면 lateral error 누적 → max_path_offset 으로 정지.
    #       표준 path follower (Pure Pursuit) 의 cross-track error 안전장치.
    #
    # v_min=-1.0 운영 정책은 yaml 그대로 유지. allow_backward=true 로 바꾸면
    # 후진 sample 가능. 정밀 도킹 등 특수 시나리오 전까지 false 권장.
    allow_backward: false
    max_path_offset: 2.0   # m, path 와 이 이상 떨어지면 정지 + PATH_LOST status

    # ----- 안전 -----
    robot_radius: 0.20             # m, URDF chassis_width 0.40 / 2
    hard_collision_distance: 0.05  # m, 거부 게이트 — 진짜 충돌 직전
    safety_distance: 0.30          # m, 명세 §7 — clearance_score 정규화 기준
    odom_timeout: 0.5              # s, EKF timeout 시 /odom fallback
    scan_range_max: 25.0           # m, LaserScan 유효 max range (명세 §4.1)

    # ----- LiDAR mount offset (2026-05-25 추가) -----
    # URDF: lidar_link 가 base_link 의 (+0.25, 0) 에 yaw=0 으로 mount.
    # 미반영 시 장애물이 실제보다 0.25m 가깝게 인식 → trajectory reject 보수적 → stuck.
    lidar_offset_x: 0.25
    lidar_offset_y: 0.0

    # ----- 토픽명 (README 계약과 일치) -----
    odom_topic: "/odometry/filtered"
    odom_fallback_topic: "/odom"
    global_path_topic: "/global_path"
    scan_topic: "/lidar"
    cmd_vel_topic: "/cmd_vel"

    # ----- 진단 로그 throttle (s) -----
    # 0 = 비활성. control_rate=20Hz 기준 1.0s = 1초당 1회.
    state_log_period: 1.0       # _state.x/y/yaw/v/w 로그
    candidate_log_period: 1.0   # best 후보 (v, w, score, local_goal) 로그

    # ----- path 변환 TF lookup timeout (s) -----
    # 매 cycle 이 아닌 global_path 받을 때 한 번만 사용.
    # AMCL publish 가 가끔 0.5~1.0s 지연돼도 OK 하도록 1.0s 권장.
    # 이 시간 안에 새 TF 가 오면 사용, 아니면 이전 path 캐싱본 유지.
    path_tf_timeout: 1.0
