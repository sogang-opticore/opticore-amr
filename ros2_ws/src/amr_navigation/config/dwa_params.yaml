# DWA Local Planner 파라미터 (2026-05-25 재설계 반영)
#
# CLAUDE.md 6.1: 모든 튜닝 값은 YAML로. 코드 안 하드코딩 금지.
# 변경 시 README.md §4 표와 동기화.
#
# 재설계 핵심 (2026-05-25 SW):
#   DWA 의 cycle 안 TF lookup 0번. EKF /odometry/filtered pose+twist 를 직접 사용.
#   global_path 받을 때 한 번만 map → odom_filtered 변환·캐싱.
#   → AMCL TF freeze / 보정 점프 의 영향 cycle 단위로 차단.
#   → 이전 spiral bug 의 근본 원인 제거.

dwa_planner:
  ros__parameters:
    use_sim_time: true

    # ----- 로봇 동역학 한계 (Notion 명세 §4.1) -----
    # TODO(디스코드 N-2): v_max 1.5 임시값. 명세 = 2.0. 팀 합의 후 갱신.
    v_max: 1.5          # m/s, ⚠ 임시값 (명세 §4.1: 2.0)
    v_min: -1.0         # m/s, 후진 운영 정책
    w_max: 1.5          # rad/s, 명세 §4.1
    a_max: 1.0          # m/s², 명세 §4.1
    alpha_max: 1.5      # rad/s², ⚠ 명세 미명시 — 시뮬 측정 후 갱신

    # ----- 샘플링 / 시뮬레이션 -----
    sample_v_n: 11
    sample_w_n: 21
    predict_horizon: 1.0    # s, trajectory 예측 시간
    dt: 0.1                 # s, 적분 step
    control_rate: 20.0      # Hz

    # ----- 평가함수 가중치 -----
    # clearance 가중치 1.2 — 좁은 통로에서 부드러운 회피 유도.
    # heading 0.6 — 직진 고집 약화.
    weight_heading: 0.6
    weight_clearance: 1.2
    weight_velocity: 0.2

    # ----- 추종 / 평가 보조 -----
    lookahead_dist: 1.0     # m, A* path 위 어디를 향할지 (DWA 의 단기 goal)
    max_clearance: 1.0      # m, clearance_score 정규화 분모
    goal_tolerance: 0.20    # m, 도착 판정. 재설계 후엔 EKF 가 안정적이라
                            # 0.10 으로 줄여도 됨 (보수적으로 0.20 유지).

    # ----- In-place rotation 모드 (2026-05-25 추가) -----
    # lookahead 의 base_link 각도가 이 값 이상이면 v=0 으로 회전만.
    # DWA 의 1초 horizon 안에 큰 yaw 차이를 못 좁히는 문제 해결.
    # 비유: 동쪽 보고 있는데 북쪽 가야 함 → "회전만" 한 후 출발.
    align_angle_thresh: 1.05  # rad ≈ 60° (π/3). 더 크게(예: 1.57=90°) 하면
                              #   회전 진입이 늦어지고, 더 작게(0.78=45°) 하면
                              #   미세 회전도 align mode → 추종 느려짐.
    align_kp: 1.5             # P 제어 gain. w_cmd = align_kp × angle, w_max 클램프.

    # ----- 안전 -----
    robot_radius: 0.20             # m, URDF chassis_width 0.40 / 2
    hard_collision_distance: 0.05  # m, 거부 게이트 — 진짜 충돌 직전
    safety_distance: 0.30          # m, 명세 §7 — clearance_score 정규화 기준
    odom_timeout: 0.5              # s, EKF timeout 시 /odom fallback
    scan_range_max: 25.0           # m, LaserScan 유효 max range (명세 §4.1)

    # ----- 토픽명 (README 계약과 일치) -----
    odom_topic: "/odometry/filtered"
    odom_fallback_topic: "/odom"
    global_path_topic: "/global_path"
    scan_topic: "/lidar"
    cmd_vel_topic: "/cmd_vel"

    # ----- 진단 로그 throttle (s) -----
    # 0 = 비활성. control_rate=20Hz 기준 1.0s = 1초당 1회.
    state_log_period: 1.0       # _state.x/y/yaw/v/w 로그
    candidate_log_period: 1.0   # best 후보 (v, w, score, local_goal) 로그

    # ----- path 변환 TF lookup timeout (s) -----
    # 매 cycle 이 아닌 global_path 받을 때 한 번만 사용.
    # AMCL publish 가 가끔 0.5~1.0s 지연돼도 OK 하도록 1.0s 권장.
    # 이 시간 안에 새 TF 가 오면 사용, 아니면 이전 path 캐싱본 유지.
    path_tf_timeout: 1.0
