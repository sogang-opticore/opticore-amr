# DWA Local Planner 파라미터 (2026-05-25 14차 — Pure Pursuit 전환)
#
# CLAUDE.md 6.1: 모든 튜닝 값은 YAML로. 코드 안 하드코딩 금지.
# 변경 시 README.md §4 표와 동기화.
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║ 14차 (2026-05-25): Pure Pursuit + Adaptive Velocity 로 완전 전환  ║
# ╚══════════════════════════════════════════════════════════════════╝
# 1~13차 patch chain (DWA score-tuning, align mode PD, hysteresis,
# overshoot stop, cooldown) 가 모두 같은 증상을 다른 각도에서 패치하다
# 진동·과회전·wall stuck 만들었다 (CLAUDE.md §0.1 원칙 8 발동 2회째).
#
# 산업 표준 컨트롤러 단일 구조로 통일 (Coulter 1992, 이후 모든 AMR 표준):
#   κ = 2y / L²                    Pure Pursuit 곡률
#   v = min(v_max, v_curve,        횡가속 한계
#           v_clearance,           장애물 비례 감속
#           v_goal,                √(2·a·d) 제동거리
#           v_heading)             cos(α) heading factor
#   w = κ · v                      ω 자동 계산 (y=0 → w=0 자동)
#
# 결정적 효과:
#   - lateral error 0 인 순간 w=0 (= "정렬되면 회전 멈춤" 알고리즘 내재)
#   - 직선 풀가속 / 코너·장애물·도착 자동 감속 (= "최대한 빠르게 도달")
#   - DWA collision check + stuck counter (= "wall stuck 방지")
#
# 재설계 핵심 (10차 이전 그대로 유지):
#   DWA 의 cycle 안 TF lookup 0번. EKF /odometry/filtered pose+twist 직접 사용.
#   global_path 받을 때 한 번만 map → odom_filtered 변환·캐싱.

dwa_planner:
  ros__parameters:
    use_sim_time: true

    # ----- 로봇 동역학 한계 (Notion 명세 §4.1) -----
    # TODO(디스코드 N-2): v_max 1.5 임시값. 명세 = 2.0. 팀 합의 후 갱신.
    v_max: 1.5          # m/s, ⚠ 임시값 (명세 §4.1: 2.0)
    v_min: -1.0         # m/s, 후진 운영 정책
    w_max: 1.5          # rad/s, 명세 §4.1
    a_max: 1.0          # m/s², 명세 §4.1
    alpha_max: 1.5      # rad/s², ⚠ 명세 미명시 — 시뮬 측정 후 갱신

    # ----- 샘플링 / 시뮬레이션 -----
    # 14차 (Pure Pursuit) 부터 sample_v_n / sample_w_n / weight_* 들은 unused.
    # 코드는 곡률 공식으로 단일 (v, w) 명령 계산. DWA grid search 안 함.
    # 호환 위해 yaml 키는 유지 (test_dwa.py 가 declare_parameter 참조).
    sample_v_n: 11
    sample_w_n: 21
    # 14차 (Pure Pursuit): predict_horizon 은 "최종 collision check 적분 시간".
    # cmd 결정 후 (v_cmd, w_cmd) 로 이 시간만큼 적분 trajectory 만들어
    # hard collision 검사 (DWA-style safety net).
    # 0.5s × 1.5m/s = 0.75m 앞까지 충돌 예측 → 가속도 한계 안에서 정지 가능.
    predict_horizon: 0.5
    dt: 0.1                 # s, 적분 step. 0.5/0.1 = 5 step.
    control_rate: 20.0      # Hz

    # ----- 평가함수 가중치 (14차 부터 unused, 호환 위해 유지) -----
    # Pure Pursuit + Adaptive Velocity 가 모든 결정을 단일 공식으로 처리.
    # DWA score 합산 안 함. yaml 키는 declare_parameter 호환 위해 잔존.
    weight_heading: 0.3
    weight_path_tangent: 2.0
    weight_clearance: 1.2
    weight_velocity: 0.3
    path_tangent_lookahead: 10

    # ----- 추종 / 평가 보조 -----
    # 14차 (Pure Pursuit): lookahead_dist 가 곡률 안정성의 핵심 파라미터.
    #   너무 작음 (< 0.3m): high-frequency 진동 (자전거 핸들 휙휙).
    #   너무 큼 (> 1.5m): corner cutting (코너 미리 자르고 들어감).
    #   v_max 의 0.5~1.0 배가 표준. 1.5m/s × 0.5s = 0.75m → 0.7m 출발점.
    # 추후 시뮬 보고 0.5~1.0 사이 fine-tune.
    lookahead_dist: 0.7
    max_clearance: 1.0      # m, [unused] 호환 위해 유지
    goal_tolerance: 0.20    # m, 도착 판정

    # ----- In-place rotation (큰 heading 오차 전용) -----
    # 14차 (Pure Pursuit): align_angle_thresh 만 사용. 나머지 align_* 는 unused.
    #
    # |α| > thresh (45°) 면 Pure Pursuit 곡률 공식이 unstable 영역 (|y| 크고
    # |x| 작음 → κ 폭주). 이 영역에서만 정지+P 회전. 그 외는 모두 PP.
    #
    # align_kp 만 in-place rotation 의 P gain 으로 재사용:
    #   w = clamp(kp · α, ±w_max · 0.7)
    align_angle_thresh: 0.785  # rad ≈ 45°, PP/회전 분기점
    align_angle_exit: 0.262    # [unused, 14차]
    align_kp: 1.5              # in-place P gain (재사용)
    align_kd: 0.5              # [unused, 14차]
    align_v_blend_max: 0.3     # [unused, 14차]
    align_cooldown: 1.0        # [unused, 14차]

    # ----- 후진 / Path offset 안전장치 (2026-05-25 추가, CLAUDE.md §0.1 원칙 8) -----
    # 먼 거리 (20m+) 시나리오에서 발견된 두 문제 해결:
    #   (a) heading_score 가 후진 trajectory 도 만점 평가 → 모든 전진이 충돌일 때
    #       후진이 1등 선택. allow_backward=false 로 후진 sample 자체 차단.
    #       EMERGENCY 가 정직하게 표시되어 A* 재계획 유도.
    #   (b) path 옆길로 한 번 빠지면 lateral error 누적 → max_path_offset 으로 정지.
    #       표준 path follower (Pure Pursuit) 의 cross-track error 안전장치.
    #
    # v_min=-1.0 운영 정책은 yaml 그대로 유지. allow_backward=true 로 바꾸면
    # 후진 sample 가능. 정밀 도킹 등 특수 시나리오 전까지 false 권장.
    allow_backward: false
    max_path_offset: 2.0   # m, path 와 이 이상 떨어지면 정지 + PATH_LOST status

    # ----- 안전 -----
    robot_radius: 0.20             # m, URDF chassis_width 0.40 / 2
    hard_collision_distance: 0.05  # m, 거부 게이트 — 진짜 충돌 직전
    safety_distance: 0.30          # m, 명세 §7 — clearance_score 정규화 기준
    odom_timeout: 0.5              # s, EKF timeout 시 /odom fallback
    scan_range_max: 25.0           # m, LaserScan 유효 max range (명세 §4.1)

    # ----- LiDAR mount offset (2026-05-25 추가) -----
    # URDF: lidar_link 가 base_link 의 (+0.25, 0) 에 yaw=0 으로 mount.
    # 미반영 시 장애물이 실제보다 0.25m 가깝게 인식 → trajectory reject 보수적 → stuck.
    lidar_offset_x: 0.25
    lidar_offset_y: 0.0

    # ----- 토픽명 (README 계약과 일치) -----
    odom_topic: "/odometry/filtered"
    odom_fallback_topic: "/odom"
    global_path_topic: "/global_path"
    scan_topic: "/lidar"
    cmd_vel_topic: "/cmd_vel"

    # ----- 진단 로그 throttle (s) -----
    # 0 = 비활성. control_rate=20Hz 기준 1.0s = 1초당 1회.
    state_log_period: 1.0       # _state.x/y/yaw/v/w 로그
    candidate_log_period: 1.0   # best 후보 (v, w, score, local_goal) 로그

    # ----- path 변환 TF lookup timeout (s) -----
    # 매 cycle 이 아닌 global_path 받을 때 한 번만 사용.
    # AMCL publish 가 가끔 0.5~1.0s 지연돼도 OK 하도록 1.0s 권장.
    # 이 시간 안에 새 TF 가 오면 사용, 아니면 이전 path 캐싱본 유지.
    path_tf_timeout: 1.0
