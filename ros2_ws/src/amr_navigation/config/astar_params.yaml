astar_planner:
  ros__parameters:
    # 휴리스틱 종류: manhattan / euclidean / octile
    # 8-connected 환경에서는 octile이 최적
    heuristic: "octile"

    # 대각 이동 허용 여부 (true = 8-connected)
    allow_diagonal: true

    # inflation 반경 [m] — 로봇 폭 0.40m + 여유
    # 좁은 통로에서 경로가 막히면 줄여볼 것
    #
    # 변경 이력 (데이터):
    # - 17차: 0.30 (마진 0.10m). (5,0)✅ (0,5)✅ (20,0)✅ (20,5)✅ 35초.
    #         단 cooldown 없어 (0,-10) 무한 loop.
    # - 18차: 0.40 (마진 0.20m, 보수적). 모든 시나리오 도달하나 좁은 통로 느림.
    # - 19차: 0.35 (마진 0.15m, 균형 시도). (20,5) 에서 (12.5, 6.5) 부근 무한 stuck.
    #         A* path 가 좁은 통로 안에 만들어지지만 robot 이 통과 못함.
    #
    # - 20차 (사용자 선택, 데이터 기반): 0.35 → 0.30 (17차 복귀)
    #   17차 0.30 에서 (20,5) 성공했던 데이터로 복귀.
    #   무한 loop 차단의 주역은 18차 추가된 recovery_cooldown (3s).
    #   즉 17차 inflation + 18차 cooldown = 모든 좋은 부분의 합집합.
    inflation_radius: 0.50

    # 경로 스무딩: none / catmull_rom / bezier
    smoothing: "catmull_rom"

    # 2026-05-24 보강: goal이 점유/inflation으로 막혔을 때
    # 인근 자유공간 셀로 자동 보정. BFS 반경 [m]. 0이면 비활성.
    # (예: Loading zone (3,15)이 맵 가장자리라 BLOCK → 인근 (3,14.5)로 자동 이동)
    goal_snap_radius: 0.6

    # 2026-05-25 추가 (SW · 페어, DWA stuck/벗어남 자동 복구):
    # 주기적 재계획 — 로봇이 path 벗어났을 때 현재 위치에서 goal 까지 새 path.
    # 0 = 비활성 (goal 받을 때만 1회), 1.0 = 1초마다 자동 재계획.
    # 표준 Nav2 의 controller_server 가 1Hz 정도 replan 하는 것과 동일.
    # 비유: GPS 가 한 번만 길 안내 안 하고, 잘못 빠지면 "재탐색" 자동 수행.
    replan_period: 1.0

    # 2026-05-31 추가 (SW · dwa-ys, 도착 인식 안정화 P1):
    # goal dedup 임계값 [m] — 같은 goal 재수신 시 재계획 스킵.
    # `ros2 topic pub --rate 0.5 /goal_pose ...` 로 같은 goal 을 반복 송신해도
    # 이 거리 이내면 무시 → DWA 의 GOAL_REACHED 신호가 흔들리지 않음.
    # TODO(미확정): 0.10 = A* 그리드 해상도(~0.05m)의 2배 초안. 시뮬 측정 후 확정.
    #   더 작으면 floating-point noise 로 dedup 미동작, 더 크면 진짜 다른 goal 도 무시.
    goal_dedup_dist: 0.10

    # 2026-05-31 리뷰 반영(Codex): dedup 에 도착 방향(yaw) 차이도 포함 [rad].
    # 같은 위치에서 yaw 만 바뀐 goal 을 '새 goal' 로 인식(놓치지 않게).
    # TODO(미확정): 0.10 rad(≈5.7°) 초안. 시뮬 측정 후 확정.
    # 참고: 현재 A*/DWA 는 최종 yaw 를 적극 추종하지 않음 → README §3.0 [미확정] 명시.
    goal_dedup_yaw: 0.10

    # 시뮬레이션 시간 사용 (Ignition Gazebo 필수)
    use_sim_time: true