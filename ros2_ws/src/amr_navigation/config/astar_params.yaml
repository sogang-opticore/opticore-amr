astar_planner:
  ros__parameters:
    # 휴리스틱 종류: manhattan / euclidean / octile
    # 8-connected 환경에서는 octile이 최적
    heuristic: "octile"

    # 대각 이동 허용 여부 (true = 8-connected)
    allow_diagonal: true

    # inflation 반경 [m] — 로봇 폭 0.40m + 여유
    # 좁은 통로에서 경로가 막히면 줄여볼 것
    #
    # 변경 이력 (데이터):
    # - 17차: 0.30 (마진 0.10m). (5,0)✅ (0,5)✅ (20,0)✅ (20,5)✅ 35초.
    #         단 cooldown 없어 (0,-10) 무한 loop.
    # - 18차: 0.40 (마진 0.20m, 보수적). 모든 시나리오 도달하나 좁은 통로 느림.
    # - 19차: 0.35 (마진 0.15m, 균형 시도). (20,5) 에서 (12.5, 6.5) 부근 무한 stuck.
    #         A* path 가 좁은 통로 안에 만들어지지만 robot 이 통과 못함.
    #
    # - 20차 (사용자 선택, 데이터 기반): 0.35 → 0.30 (17차 복귀)
    #   17차 0.30 에서 (20,5) 성공했던 데이터로 복귀.
    #   무한 loop 차단의 주역은 18차 추가된 recovery_cooldown (3s).
    #   즉 17차 inflation + 18차 cooldown = 모든 좋은 부분의 합집합.
    inflation_radius: 0.50

    # 벽 근접 비용 [m] — inflation 바깥 free 셀도 모두 같은 비용으로 보지 않고,
    # raw obstacle 기준 이 거리 안쪽은 추가 비용을 줘 통로 중앙을 선호한다.
    # DWA robot_radius(0.20) + clearance_slowdown_distance(0.80) ≈ 1.0m와 맞춘 초안.
    # TODO(미확정): RunPod 주행 로그로 0.8~1.2m 범위 튜닝.
    preferred_clearance: 1.00

    # clearance 비용 가중치. 0이면 기존처럼 shortest path만 선호.
    # 너무 낮으면 벽 경계 path가 남고, 너무 높으면 긴 우회를 과하게 선호할 수 있다.
    # TODO(미확정): 4~8 범위 튜닝.
    clearance_cost_weight: 6.0

    # 경로 스무딩: none / catmull_rom / bezier
    smoothing: "catmull_rom"

    # 2026-05-24 보강: goal이 점유/inflation으로 막혔을 때
    # 인근 자유공간 셀로 자동 보정. BFS 반경 [m]. 0이면 비활성.
    # (예: Loading zone (3,15)이 맵 가장자리라 BLOCK → 인근 (3,14.5)로 자동 이동)
    goal_snap_radius: 0.6

    # 주기적 재계획 — 기본 1Hz.
    # DWA의 stale empty 방어와 재계획 실패 시 기존 path 유지 정책을 전제로,
    # 현재 pose 기준 global path를 주기적으로 갱신한다.
    # 필요 시 0으로 바꾸면 goal/event 기반 재계획만 사용한다.
    replan_period: 1.0

    # DWA 상태 이벤트 기반 재계획.
    # 즉시 재계획: EMERGENCY/PATH_LOST/RECOVERY_DONE
    # 복구 후 재계획 fallback: FORWARD_ONLY/RECOVERY → NORMAL 또는 STOPPED 전이
    # STOPPED_NEAR_WALL은 순간 튐이 많아 기본 trigger에서 제외한다. DWA가 recovery를
    # 수행한 뒤 복구 완료 순간 한 번 새 path를 받는 쪽이 path churn이 적다.
    dwa_status_topic: "/dwa/status"
    status_replan_cooldown: 2.0
    status_replan_states: ["EMERGENCY", "PATH_LOST", "RECOVERY_DONE"]
    status_replan_after_states: ["FORWARD_ONLY", "RECOVERY"]
    status_replan_reset_states: ["NORMAL", "ALIGN", "STOPPED", "REACHED", "GOAL_REACHED"]

    # 2026-05-31 추가 (SW · dwa-ys, 도착 인식 안정화 P1):
    # goal dedup 임계값 [m] — 같은 goal 재수신 시 재계획 스킵.
    # `ros2 topic pub --rate 0.5 /goal_pose ...` 로 같은 goal 을 반복 송신해도
    # 이 거리 이내면 무시 → DWA 의 GOAL_REACHED 신호가 흔들리지 않음.
    # TODO(미확정): 0.10 = A* 그리드 해상도(~0.05m)의 2배 초안. 시뮬 측정 후 확정.
    #   더 작으면 floating-point noise 로 dedup 미동작, 더 크면 진짜 다른 goal 도 무시.
    goal_dedup_dist: 0.10

    # 2026-05-31 리뷰 반영(Codex): dedup 에 도착 방향(yaw) 차이도 포함 [rad].
    # 같은 위치에서 yaw 만 바뀐 goal 을 '새 goal' 로 인식(놓치지 않게).
    # TODO(미확정): 0.10 rad(≈5.7°) 초안. 시뮬 측정 후 확정.
    # 참고: 현재 A*/DWA 는 최종 yaw 를 적극 추종하지 않음 → README §3.0 [미확정] 명시.
    goal_dedup_yaw: 0.10

    # 두 갈래 경로가 거의 같은 비용일 때 1Hz 재계획이 통로를 번갈아 선택하지 않도록,
    # 새 후보가 기존 path의 남은 거리보다 이 값 이상 짧을 때만 갈아탄다.
    # 0.35m는 0.05m grid 기준 약 7셀이라 AMCL/TF cm급 흔들림과 1~2셀 tie를 충분히 덮는다.
    # TODO(미확정): RunPod에서 branch 전환 로그를 보고 0.25~0.50m 범위 튜닝.
    path_switch_hysteresis: 0.35
    path_switch_max_start_offset: 0.80
    # 새 goal 직후에는 DWA goal/path 수신 순서 보정을 위해 이 시간 동안 hysteresis를 건너뛰고 재발행.
    # TODO(미확정): 대형 맵 plan time과 RunPod 수신 로그 기준 3~6s 범위 튜닝.
    new_goal_force_publish_sec: 5.0

    # 목표 근처에서 inflated map 기준 직선 segment가 안전하면 A* 우회 path 대신
    # goal까지 직선 final approach path를 발행해 목표 주변 배회를 줄인다.
    goal_direct_distance: 2.0
    goal_direct_min_clearance: 0.55

    # 시뮬레이션 시간 사용 (Ignition Gazebo 필수)
    use_sim_time: true
