[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-lite-spike"
version = "0.1.0"
description = "ROS-free 2D AMR local-planning technical spike"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6", "torch>=2", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8"]
reference-rl = ["gymnasium>=0.29", "stable-baselines3>=2.3"]

[tool.setuptools.packages.find]
include = ["amr_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
